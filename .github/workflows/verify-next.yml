name: Verify Next.js build

on:
  push:
    branches:
      - audit/vercel-ready
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify questionnaire schema
        run: npm run verify:form

      - name: Build Next.js
        run: npm run build

      - name: Verify Next.js output
        run: test -d .next
